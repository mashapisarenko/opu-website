name: Publish the blog on schedule

# Articles are written and checked in advance, then wait in blog/_queue/.
# This publishes whatever is due, once a day, whether or not anyone is at the
# computer. It only ever moves an already-written file into place and adds its
# card, its JSON-LD entry and its sitemap row.

on:
  schedule:
    - cron: '20 14 * * *'   # 14:20 UTC = 7:20 in Las Vegas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish anything due
        id: run
        run: python3 blog/_publish.py | tee "$RUNNER_TEMP/publish.log"

      - name: Commit and push if something was published
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "nothing changed — no commit"
            exit 0
          fi
          slugs=$(sed -n 's/^PUBLISHED=//p' "$RUNNER_TEMP/publish.log" | tr ',' ' ')
          git config user.name  "OPU blog scheduler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Blog published on schedule:${slugs:+ }$slugs"
          git push

      - name: Tell Bing, Yahoo and the other IndexNow engines about every page the publish changed
        if: success()
        continue-on-error: true
        run: |
          slugs=$(sed -n 's/^PUBLISHED=//p' "$RUNNER_TEMP/publish.log" | tr ',' ' ')
          [ -z "$slugs" ] && exit 0
          # only announce a commit this run actually made
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && { echo "no publish commit in this run"; exit 0; }
          # every public page the publish commit touched: the new articles, the blog
          # index, the home page cards, related-article links in older posts, ...
          urls=$(git diff --name-only --diff-filter=d HEAD~1 HEAD -- '*.html' \
                 | grep -v '^blog/_' | grep -v '^_health/' | grep -v '^studio.html$' \
                 | sed -e 's#^index.html$##' -e 's#/index.html$#/#' -e 's#^#https://onlinepianouniversity.com/#')
          [ -z "$urls" ] && { echo "publish commit changed no public page"; exit 0; }
          echo "$urls"
          sleep 150
          python3 indexnow_ping.py $urls https://onlinepianouniversity.com/sitemap.xml
